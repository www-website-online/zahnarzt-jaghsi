# Cache successful immutable assets; never cache missing image responses.
map $status $zahnarzt_image_cache {
    default "no-store";
    200 "public, max-age=2592000, immutable";
    206 "public, max-age=2592000, immutable";
    304 "public, max-age=2592000, immutable";
}

server {
    listen 80;
    server_name zahnarzt-jaghsi.de www.zahnarzt-jaghsi.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zahnarzt-jaghsi.de www.zahnarzt-jaghsi.de;

    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;


    location /uploads/optimized/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $zahnarzt_image_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }

    # Metadata, drafts, revision snapshots and archives are never public.
    location /uploads/ {
        return 404;
    }

    location /admin/ {
        client_max_body_size 32m;
        limit_req zone=authlogin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
