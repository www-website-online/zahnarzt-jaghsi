name: Run tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked
      - name: Test application in temporary storage
        run: uv run --locked python -B -m unittest discover -s tests -v
